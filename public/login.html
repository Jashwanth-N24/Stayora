<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF4EB">
  <title>Sign In — Stayora | Book • Stay • Relax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 20%, rgba(234, 212, 183, 0.45) 0%, transparent 60%),
                  linear-gradient(135deg, #FAF4EB 0%, #F5E8D6 100%);
    }
    .auth-container {
      width: 100%;
      max-width: 460px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 38px 34px;
      box-shadow: var(--shadow-xl);
      text-align: center;
      position: relative;
    }
    .auth-logo-link {
      display: inline-block;
      margin-bottom: 18px;
    }
    .auth-logo {
      height: 64px;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
      transition: transform var(--transition-fast);
    }
    .auth-logo:hover {
      transform: scale(1.03);
    }
    .auth-header h1 {
      font-family: var(--font-serif);
      font-size: 28px;
      margin: 0 0 8px 0;
      color: var(--ink);
    }
    .auth-header p {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 24px 0;
    }
    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 22px;
    }
    .role-tab-btn {
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      color: var(--muted);
      transition: all var(--transition-fast);
      text-align: center;
    }
    .role-tab-btn.active {
      background: #FFFFFF;
      color: var(--red);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .auth-form {
      text-align: left;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--ink-secondary);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-group input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
    }
    .demo-hint {
      background: #FFFDF5;
      border: 1px dashed #E5A11D;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 11px;
      color: #8C5405;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .demo-hint code {
      font-family: var(--font-mono);
      font-weight: 700;
      background: #FEF7EA;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .auth-submit-btn {
      width: 100%;
      height: 48px;
      font-size: 14px;
    }
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-light);
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .auth-footer a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-home:hover {
      color: var(--ink);
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <a href="/" class="auth-logo-link" aria-label="Stayora Home">
      <img src="/stayora-logo.jpg" alt="Stayora — Book • Stay • Relax" class="auth-logo">
    </a>

    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your Stayora account to continue</p>
    </div>

    <!-- Role Tabs -->
    <div class="role-tabs" id="roleTabs">
      <button type="button" class="role-tab-btn active" data-role="user">👤 Traveller</button>
      <button type="button" class="role-tab-btn" data-role="manager">🏨 Partner</button>
      <button type="button" class="role-tab-btn" data-role="admin">🛡️ Admin</button>
    </div>

    <!-- Demo Password Helper -->
    <div class="demo-hint" id="demoHint">
      <span>Demo credentials:</span>
      <span id="hintCreds"><code>user@stayora.com</code> / <code>User@123</code></span>
    </div>

    <form class="auth-form" id="loginForm">
      <input type="hidden" name="role" id="roleInput" value="user">

      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input type="email" id="emailInput" name="email" value="user@stayora.com" required placeholder="name@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" name="password" required placeholder="Enter your password" autocomplete="current-password" autofocus>
      </div>

      <button type="submit" class="primary auth-submit-btn" id="submitBtn">
        Sign In to Stayora
      </button>
    </form>

    <div class="auth-footer">
      New to Stayora? <a href="/register.html">Create an account ↗</a>
    </div>
  </div>

  <a href="/" class="back-home">
    ← Back to Explore Stays
  </a>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = s => document.querySelector(s);
    function toast(msg) {
      const el = $('#toast');
      if (!el) return;
      el.textContent = msg;
      el.className = 'toast';
      setTimeout(() => el.className = '', 3400);
    }

    const roleDefaults = {
      user: { email: 'user@stayora.com', pw: 'User@123', label: 'Traveller' },
      manager: { email: 'manager@stayora.com', pw: 'Manager@123', label: 'Hotel Partner' },
      admin: { email: 'admin@stayora.com', pw: 'Admin@123', label: 'Platform Admin' }
    };

    function selectRole(role) {
      document.querySelectorAll('.role-tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.role === role);
      });
      $('#roleInput').value = role;
      const def = roleDefaults[role] || roleDefaults.user;
      $('#emailInput').value = def.email;
      $('#passwordInput').value = '';
      $('#passwordInput').focus();
      $('#hintCreds').innerHTML = `<code>${def.email}</code> / <code>${def.pw}</code>`;
    }

    // Read URL params (e.g. ?role=manager or ?email=...)
    const params = new URLSearchParams(window.location.search);
    const initialRole = params.get('role');
    const initialEmail = params.get('email');
    if (initialRole && roleDefaults[initialRole]) {
      selectRole(initialRole);
    }
    if (initialEmail) {
      $('#emailInput').value = initialEmail;
    }

    document.querySelectorAll('.role-tab-btn').forEach(b => {
      b.onclick = () => selectRole(b.dataset.role);
    });

    $('#loginForm').onsubmit = async e => {
      e.preventDefault();
      const btn = $('#submitBtn');
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      const email = $('#emailInput').value.trim();
      const password = $('#passwordInput').value;
      const role = $('#roleInput').value;

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error?.message || 'Invalid email or password');

        localStorage.setItem('stayora_token', data.token);
        localStorage.setItem('stayora_user', JSON.stringify(data.user));

        toast(`Welcome, ${data.user.name}! Redirecting...`);
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } catch (err) {
        toast(err.message);
        btn.disabled = false;
        btn.textContent = 'Sign In to Stayora';
      }
    };
  </script>
</body>
</html>
